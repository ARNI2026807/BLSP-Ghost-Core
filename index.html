<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLSP Ghost Core - Küresel Erişim Kapısı</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal {
            width: 80%;
            max-width: 600px;
            background: #000;
            border: 1px solid #00ff00;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            border-radius: 5px;
        }
        .imlec {
            animation: kırpışma 1s infinite;
        }
        @keyframes kırpışma {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .biyometrik-alan {
            margin-top: 20px;
            border: 1px dashed #00ff00;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
        }
        .biyometrik-alan:hover {
            background: rgba(0, 255, 0, 0.1);
        }
        .veri-kutusu {
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            margin-top: 15px;
            font-size: 12px;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div>Microsoft Windows [Version 10.0.22631]</div>
        <div>(c) Microsoft Corporation. Tüm hakları saklıdır.</div>
        <br>
        <div>[MERKEZİYESİZ BULUT HAFIZA AKTİF]</div>
        <div>Bu ekrandan üreteceğiniz biyometrik mühür, sizi her bilgisayarda tanıyacaktır.</div>
        <br>
        <div class="biyometrik-alan" id="inputBox" tabindex="0">
            <span id="status">[KÜRESEL MÜHÜR ALANI]<br>Tıklayın, gizli kelimenizi yazın ve Enter'a basın.</span>
        </div>
        <div class="veri-kutusu" id="dataBox"></div>
        <br>
        <div>C:\Users\ortak><span class="imlec">_</span></div>
    </div>

    <script>
        let pressTimes = {};
        let timings = [];
        const inputBox = document.getElementById('inputBox');
        const status = document.getElementById('status');
        const dataBox = document.getElementById('dataBox');
        
        inputBox.addEventListener('keydown', (e) => {
            if (!pressTimes[e.key]) {
                pressTimes[e.key] = performance.now();
            }
        });

        inputBox.addEventListener('keyup', (e) => {
            if (pressTimes[e.key]) {
                let duration = performance.now() - pressTimes[e.key];
                timings.push({key: e.key, ms: duration.toFixed(2)});
                delete pressTimes[e.key];
                
                if (e.key === 'Enter') {
                    status.innerHTML = "<span style='color: #ffffff;'>[MÜHÜR ÜRETİLDİ]</span><br>Küresel bulut kimliğiniz başarıyla oluşturuldu!";
                    
                    // Dünyanın her yerinde bizi tanıyacak olan şifreli sayı dizisini ekranda gösteriyoruz
                    let veriDizisi = timings[:-1].map(t => `(${t.key}:${t.ms})`).join(", ");
                    dataBox.innerText = "Siber Kimlik Kodunuz: [" + veriDizisi + "]";
                    dataBox.style.display = "block";
                    
                    timings = [];
                    pressTimes = {};
                }
            }
        });
    </script>
</body>
</html>
